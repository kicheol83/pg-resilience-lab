global
    log stdout format raw local0 info
    maxconn 4000
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners
    stats timeout 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s
    default-server inter 1s fastinter 500ms downinter 1s rise 2 fall 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker

frontend pg_rw
    bind :5000
    default_backend pg_primary

frontend pg_ro
    bind :5001
    default_backend pg_replicas

backend pg_primary
    option httpchk GET /primary
    http-check expect status 200
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
    server pg18 pg18:5432 check port 8008 disabled

backend pg_replicas
    balance leastconn
    option httpchk GET /replica
    http-check expect status 200
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

listen stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
