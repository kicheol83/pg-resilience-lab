listen_addresses = '*'
port = 5432
unix_socket_directories = '/run/postgresql'
max_connections = 150
superuser_reserved_connections = 5
password_encryption = 'scram-sha-256'
hba_file = '/etc/lab/pg_hba.conf'
ssl = on
ssl_cert_file = '/etc/pg-tls/node.crt'
ssl_key_file = '/etc/pg-tls/node.key'
ssl_ca_file = '/etc/pg-tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
shared_buffers = '256MB'
effective_cache_size = '768MB'
work_mem = '8MB'
maintenance_work_mem = '128MB'
wal_level = 'logical'
wal_log_hints = on
wal_compression = 'lz4'
max_wal_senders = 10
max_replication_slots = 10
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2
wal_keep_size = '512MB'
max_slot_wal_keep_size = '4GB'
hot_standby = on
hot_standby_feedback = on
wal_receiver_status_interval = '1s'
wal_sender_timeout = '10s'
wal_receiver_timeout = '10s'
tcp_keepalives_idle = 5
tcp_keepalives_interval = 2
tcp_keepalives_count = 3
tcp_user_timeout = '10s'
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9
max_wal_size = '1GB'
min_wal_size = '256MB'
archive_mode = on
archive_command = 'pgbackrest --stanza=ledger archive-push %p'
archive_timeout = '60s'
synchronous_standby_names = 'ANY 1 (pg1, pg2, pg3)'
synchronous_commit = on
shared_preload_libraries = 'repmgr, pg_stat_statements, pg_cron, credcheck'
max_worker_processes = 16
cron.database_name = 'ledgercore'
cron.use_background_workers = on
cron.timezone = 'Asia/Seoul'
pg_stat_statements.track = 'top'
track_io_timing = on
track_wal_io_timing = on
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_min_duration_statement = '250ms'
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = '1s'
log_replication_commands = on
log_temp_files = 0
deadlock_timeout = '1s'
autovacuum_naptime = '10s'
autovacuum_vacuum_cost_limit = 1000
credcheck.password_min_length = 16
credcheck.password_min_upper = 1
credcheck.password_min_lower = 1
credcheck.password_min_digit = 1
credcheck.password_min_special = 1
credcheck.password_contain_username = off
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'
